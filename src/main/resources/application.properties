spring.application.name=supermercado-mcp-agent

# API HTTP del asistente (POST /api/chat, GET /api/estado). La interfaz de desarrollo de ADK
# (exec:java@runAdkWebServer) usa el puerto 8080 y no lee esta propiedad.
server.port=${AGENT_PORT:8081}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# La configuración del agente se lee de variables de entorno (ver README y .env.example):
#   MCP_SERVER_URL, MCP_CONNECT_TIMEOUT_SECONDS, MCP_READ_TIMEOUT_SECONDS,
#   MCP_NOTIFICATION_TIMEOUT_SECONDS, MCP_VERIFY_ON_STARTUP, GEMINI_MODEL,
#   AGENT_RESPONSE_TIMEOUT_SECONDS y GOOGLE_API_KEY (esta última nunca se escribe en archivos versionados).
# Los valores predeterminados están centralizados en ConfiguracionAgente; el modelo predeterminado es
# gemini-3.6-flash (GEMINI_MODEL lo sustituye).

logging.level.com.udea.agente_mcp=INFO
